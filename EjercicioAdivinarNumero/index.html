<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>ADIVINACIÓN DE UN NÚMERO</title>
</head>
<body>
    <div id="cabecera">ADIVINACIÓN DE UN NÚMERO</div>

    <div id="contenedor">
        <p>Elige el número máximo:</p>

        <input type="number" id="maximo" min="1">

        <button id="empezar">Empezar juego</button>

        <div id="juego">
            <p>Introduce un número:</p>

            <input type="number" id="intento">

            <button id="comprobar">Comprobar</button>

            <div id="vidas"></div>

            <div id="mensaje"></div>
        </div>
    </div>

    <script src="script.js"></script>
    
</body>
</html>
